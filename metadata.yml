Slug: biosynfoni-fingerprint
Status: In progress
Title: BioSynFoni biosynthesis-informed molecular fingerprint
Description: |
  BioSynFoni is a biosynthesis-informed count-based molecular fingerprint designed for natural product
  research. It decomposes molecules into 39 biosynthetic building block substructures derived from
  Dewick's classification of natural product biosynthetic pathways, including coenzymes, amino acids,
  sugars, shikimate, acetate, and terpenoid pathway building blocks, as well as halogens, functional
  groups, and carbon ring systems. The fingerprint is computed via SMARTS substructure matching using
  RDKit and returns an integer count vector. It was shown to outperform MACCS, Morgan, and Daylight-like
  fingerprints for biosynthetic distance estimation and performs comparably for natural product
  classification while being more compact and interpretable.
